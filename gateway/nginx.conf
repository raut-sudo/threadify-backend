# ── Worker processes ─────────────────────────────────────────────────────────
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 30 requests/s per IP; auth endpoints have a tighter burst limit
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=10r/s;

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream user_service {
        server user-service:8000;
    }

    upstream thread_service {
        server thread-service:8001;
    }

    upstream notification_service {
        server notification-service:8002;
    }

    upstream ws_gateway {
        server ws-gateway:8003;
    }

    # ── Server block ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Common proxy headers forwarded to every upstream
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Pass the Authorization header to every upstream (JWT bearer tokens)
        proxy_pass_header Authorization;

        # Rewrite upstream redirect Location headers back to the gateway
        proxy_redirect http://user-service:8000/  http://$http_host/;
        proxy_redirect http://thread-service:8001/ http://$http_host/;
        proxy_redirect http://notification-service:8002/ http://$http_host/;

        # ── Gateway health check ───────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # ══════════════════════════════════════════════════════════════════════
        # USER SERVICE  (user-service:8000)
        # Routes: /api/v1/auth/*, /api/v1/users/*
        # ══════════════════════════════════════════════════════════════════════

        # Auth — register, login, refresh token, logout
        location /api/v1/auth {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://user_service;
        }

        # User profile management (me, update, delete, list)
        location /api/v1/users {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://user_service;
        }

        # Admin-only operations (role changes, user banning, user listing)
        location /api/v1/admin {
            limit_req zone=api_general burst=10 nodelay;
            proxy_pass http://user_service;
        }

        # User-service liveness probe
        location = /health/user {
            access_log off;
            proxy_pass http://user_service/health;
        }

        # ══════════════════════════════════════════════════════════════════════
        # THREAD SERVICE  (thread-service:8001)
        # Routes: /api/v1/threads/*, /api/v1/comments/*, /api/v1/user-snaps/*
        # ══════════════════════════════════════════════════════════════════════

        # Thread CRUD + thread likes
        location /api/v1/threads {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://thread_service;
        }

        # Comment CRUD + comment likes
        location /api/v1/comments {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://thread_service;
        }

        # User snapshots — denormalised author data embedded in thread/comment responses
        location /api/v1/user-snaps {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://thread_service;
        }

        # Thread-service liveness probe
        location = /health/thread {
            access_log off;
            proxy_pass http://thread_service/health;
        }

        # ══════════════════════════════════════════════════════════════════════
        # NOTIFICATION SERVICE  (notification-service:8002)
        # Routes: /api/v1/notifications/*
        # ══════════════════════════════════════════════════════════════════════

        location /api/v1/notifications {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://notification_service;
        }

        # Notification-service liveness probe
        location = /health/notification {
            access_log off;
            proxy_pass http://notification_service/health;
        }

        # ══════════════════════════════════════════════════════════════════════
        # WS GATEWAY  (ws-gateway:8003)
        # Routes: /ws  — Socket.IO WebSocket + HTTP long-poll
        # ══════════════════════════════════════════════════════════════════════

        location /ws {
            proxy_pass http://ws_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $http_host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # WS gateway liveness probe
        location = /health/ws {
            access_log off;
            proxy_pass http://ws_gateway/health;
        }

        # ── Catch-all: 404 for anything not matched above ──────────────────
        location / {
            return 404 '{"detail":"route not found"}';
            add_header Content-Type application/json;
        }
    }
}