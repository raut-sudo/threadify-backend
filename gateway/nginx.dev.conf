# ── Dev gateway config ────────────────────────────────────────────────────────
# Use this config when running services directly on localhost (no Docker).
# Production equivalent: nginx.conf
# ─────────────────────────────────────────────────────────────────────────────

# Store PID locally (no root needed)
pid /home/ramsantoshraut/projects/threadify/server/nginx.pid;

worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Store logs in a writable location
    access_log  /tmp/nginx.access.log;
    error_log   /tmp/nginx.error.log warn;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=10r/s;

    # ── Upstreams — localhost ports instead of Docker service names ───────────
    upstream user_service {
        server 127.0.0.1:8000;
    }

    upstream thread_service {
        server 127.0.0.1:8001;
    }

    upstream notification_service {
        server 127.0.0.1:8002;
    }

    # ── Server block ──────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name localhost;

        # Common proxy headers
        # $http_host preserves the port (e.g. localhost:8080) so that nginx
        # correctly rewrites Location headers from upstream 307 redirects.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Forward JWT bearer tokens
        proxy_pass_header Authorization;

        # Rewrite upstream redirect Location headers (e.g. FastAPI trailing-slash
        # 307s) so they point back to the gateway instead of the raw upstream port.
        proxy_redirect http://127.0.0.1:8000/ http://$http_host/;
        proxy_redirect http://127.0.0.1:8001/ http://$http_host/;
        proxy_redirect http://127.0.0.1:8002/ http://$http_host/;

        # ── Gateway health check ───────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"gateway","env":"dev"}';
            add_header Content-Type application/json;
        }

        # ══════════════════════════════════════════════════════════════════════
        # USER SERVICE → 127.0.0.1:8000
        # ══════════════════════════════════════════════════════════════════════

        location /api/v1/auth {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://user_service;
        }

        location /api/v1/users {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://user_service;
        }

        location = /health/user {
            access_log off;
            proxy_pass http://user_service/health;
        }

        # ══════════════════════════════════════════════════════════════════════
        # THREAD SERVICE → 127.0.0.1:8001
        # ══════════════════════════════════════════════════════════════════════

        location /api/v1/threads {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://thread_service;
        }

        location /api/v1/comments {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://thread_service;
        }

        location /api/v1/user-snaps {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://thread_service;
        }

        location = /health/thread {
            access_log off;
            proxy_pass http://thread_service/health;
        }

        # ══════════════════════════════════════════════════════════════════════
        # NOTIFICATION SERVICE → 127.0.0.1:8002
        # ══════════════════════════════════════════════════════════════════════

        location /api/v1/notifications {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://notification_service;
        }

        location = /health/notification {
            access_log off;
            proxy_pass http://notification_service/health;
        }

        # ── Catch-all ──────────────────────────────────────────────────────
        location / {
            return 404 '{"detail":"route not found"}';
            add_header Content-Type application/json;
        }
    }
}