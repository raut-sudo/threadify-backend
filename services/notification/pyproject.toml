[project]
name = "notification"
version = "0.1.0"
description = "Notification Service — consumes events, serves notification REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.0.0",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.6",
    "fastapi[standard]>=0.135.3",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.48",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "BLE", # blind-except
]
