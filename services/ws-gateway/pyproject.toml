[project]
name = "ws-gateway"
version = "0.1.0"
description = "WebSocket Gateway — real-time event delivery via Socket.IO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.0.0",
    "aiohttp>=3.9.0",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-socketio>=5.11.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
